[project]
name = "tutor-training"
version = "0.1.0"
description = "PedagogicalRL (EMNLP 2025) replication trainer for the Socratic AI Tutor (issue #46)"
requires-python = ">=3.11"
# The core episode, reward, and config code is standard-library only so it can be tested anywhere.
# GPU dependencies are installed on the training machine (the molab notebook does it); torch comes
# from the GPU image and vLLM is installed into its own venv by tutor_rl/vllm_server.py.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "math-verify==0.9.0",  # answer grading (rewards.answers_match); tests skip symbolic cases without it
]

gpu = [
    "transformers==5.23.0",
    "peft==0.21.3",
    "accelerate==1.15.0",
    "datasets==5.2.0",
    "flash-linear-attention==0.6.0",
    "math-verify==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["replication/scripts"]  # generated by the paper-replication harness

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# marimo notebook: Markdown cells and UI one-liners read better unwrapped.
"tutor_rl_molab.py" = ["E501"]
# The paper's prompts are copied verbatim, one paragraph per line.
"tutor_rl/prompts.py" = ["E501"]
