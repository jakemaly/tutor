[project]
name = "tutor-training"
version = "0.1.0"
description = "Resource-bounded PedagogicalRL-inspired trainer for the Socratic AI Tutor (issue #46)"
requires-python = ">=3.11"
# The core episode, reward, and config code is standard-library only so it can be tested anywhere.
# GPU dependencies (unsloth, trl, vllm, torch) are installed on the training machine; see README.md.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
