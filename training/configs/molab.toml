# Replication of PedagogicalRL (Dinucu-Jianu et al., EMNLP 2025, aclanthology.org/2025.emnlp-main.15)
# on one molab GPU (RTX PRO 6000, 96 GB). Every value the paper states is copied and marked
# "paper"; anything else is a choice recorded in training/replication/spec/assumptions_and_unknowns.md.
# The paper used 4x A100 80 GB for ~48 h per run. Here the run spans several 12-hour molab
# sessions and resumes from the Hub. Deviation: the tutor is Qwen3.5-9B with a LoRA adapter, not a
# full fine-tune of Qwen2.5-7B-Instruct (a full fine-tune does not fit next to the student and judge).
#
# GPU memory: everything together stays under 80% of the GPU ([gpu] below).

run_name = "pedagogicalrl-qwen35-9b-lam075"
seed = 3407

[tutor]
# Trainable policy: the Qwen3.5-9B checkpoint the app serves (deployment/modal_qwen.py), thinking off.
# bf16 LoRA, not QLoRA: Unsloth's Qwen3.5 guide advises against QLoRA for this family.
model = "Qwen/Qwen3.5-9B"
revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
enable_thinking = false    # the paper's main models have no thinking tags ("+think" is an ablation)
lora_rank = 32
lora_alpha = 32
lora_dropout = 0.0         # keep 0 so training log-probs match the sampling distribution
target_modules = [
    "q_proj", "k_proj", "v_proj", "o_proj",      # full-attention layers
    "in_proj_qkv", "in_proj_z", "out_proj",      # Gated DeltaNet (linear-attention) layers
    "gate_proj", "up_proj", "down_proj",         # MLPs
]
temperature = 1.0          # paper
top_p = 1.0
max_tokens_per_turn = 256  # not stated in the paper; longer turns get the 0.5 truncation penalty
generation_batch_size = 48 # tutor turns generated together; fits the 50% tutor cap

[student]
# Paper: Llama-3.1-8B-Instruct, served with vLLM and FP8 quantization. Gated: accept the licence.
model = "meta-llama/Llama-3.1-8B-Instruct"
revision = "0e9e39f249a16976918f6564b8830bc894c89659"
env_prefix = "TRAIN_STUDENT"  # TRAIN_STUDENT_BASE_URL / _MODEL / _API_KEY for an external endpoint
vllm_args = ["--quantization", "fp8", "--enable-prefix-caching"]
temperature = 0.6          # not stated; Llama-3.1's default
max_tokens_per_turn = 256  # chat turns ("do not respond with overly long messages")
max_tokens_final = 1024    # pre- and post-dialog step-by-step solutions
port = 8101
gpu_memory_utilization = 0.15  # 14 GB: FP8 weights ~9 GB + KV cache
max_model_len = 8192
max_num_seqs = 128  # also bounds vLLM's CUDA-graph memory

[judge]
# Paper: Qwen2.5-14B-Instruct, 4-bit AWQ, two prompts (leakage, helpfulness) sampled twice each.
model = "Qwen/Qwen2.5-14B-Instruct-AWQ"
revision = "539535859b135b0244c91f3e59816150c8056698"
env_prefix = "TRAIN_JUDGE"
vllm_args = ["--enable-prefix-caching"]
temperature = 0.7          # not stated; must be > 0 for two samples to differ
max_tokens = 512
port = 8102
gpu_memory_utilization = 0.15  # 14 GB: AWQ weights ~10 GB + KV cache
max_model_len = 8192
max_num_seqs = 128  # also bounds vLLM's CUDA-graph memory
share_student = false      # true: the student's server also judges (not the paper's setup)

[eval_judge]
# Paper: the held-out leak judge is from another family, Gemma3-27B, so the tutor is not scored by
# the judge it was trained against. 4-bit (w4a16) so it fits; ungated.
model = "RedHatAI/gemma-3-27b-it-quantized.w4a16"
revision = "2b537554d6c6f6368945e8df4e5fb7bbbb5d56c9"
env_prefix = "EVAL_JUDGE"
vllm_args = ["--enable-prefix-caching", "--limit-mm-per-prompt", '{"image": 0}']
temperature = 0.0
max_tokens = 512
port = 8103
gpu_memory_utilization = 0.24  # 23 GB: 4-bit weights ~19 GB + KV cache
max_model_len = 8192
max_num_seqs = 64

[gpu]
# Everything on the GPU together stays under max_fraction of its memory (see tutor_rl/gpu_budget.py):
#   training:   student 15% + judge 15%               + tutor 50% = 80%
#   evaluation: student 15% + judge 15% + Gemma 24%   + tutor 26% = 80%
# The tutor's share is a hard PyTorch cap: whatever the servers leave under the target.
max_fraction = 0.80
min_tutor_fraction = 0.24

[episode]
max_turns = 16             # paper: total tutor + student messages
student_final_attempts = 8 # paper: K = 8 post-dialog solutions
initiator = "random"       # paper: student- or tutor-initiated, uniform, same for a problem's rollouts

[reward]
# r = r_sol + (r_ped - 1) * lam + r_templ. lam = 0.75 is the paper's "balanced" model
# (Table 2: delta solve 25.3, leak 10.6). For the hard variant set hard = true, lam = 1.0.
lam = 0.75
hard = false
judges = ["leakage", "helpfulness"]
samples_per_judge = 2      # paper
template = true            # appendix B: +0.1 if the tutor ends the dialogue, -0.5 if a turn is cut off
end_bonus = 0.1
length_penalty = 0.5

[train]
problems_per_step = 16     # paper: 16 problems per batch
episodes_per_problem = 8   # paper: 8 rollouts per problem (the GRPO group)
num_iterations = 2         # paper: mu = 2 gradient steps per batch
max_steps = 150            # paper: ~300 policy updates (150 batches x mu 2), ~24% of the train set
learning_rate = 5e-6       # paper: 5e-7 for a full fine-tune; LoRA uses ~10x (deviation)
lr_scheduler = "linear"    # not stated; TRL's default (linear decay, no warmup)
warmup_steps = 0
beta = 0.001               # paper: KL coefficient
epsilon = 0.2              # not stated; TRL's default clip range
adam_beta1 = 0.9
adam_beta2 = 0.999
weight_decay = 0.0
max_grad_norm = 1.0
save_steps = 5             # each step is long; checkpoint (and upload) often
output_dir = "outputs/pedagogicalrl-qwen35-9b-lam075"  # outside git; see .gitignore

[eval]
problems = 500             # paper: the 500 held-out Big-Math problems
episodes_per_problem = 1
leak_judge_samples = 1
generation_batch_size = 12  # tutor batch during eval, when its cap shrinks to 26% for Gemma
seed = 1234

[data]
# The paper's exact split (Table 1 counts match per source), published by its first author.
format = "bigmath"
dataset = "rd211/Big-Math-RL-Verified-Filtered"
revision = "80714c393abc52de4025c3e7fc6acd30f376be52"
train_split = "train"
train_limit = 10000
eval_split = "test"
eval_limit = 500
hub_dataset = "pedagogicalrl-bigmath"  # copy in the socratictutor org, under <data_version>/
