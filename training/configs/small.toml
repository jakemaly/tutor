# Resource-bounded PedagogicalRL-inspired run (issue #46).
# Reference config for comparison: eth-lre/PedagogicalRL config/train_rl/7b.yaml
# (7B tutor, 8B student, 14B judge, 4+ GPUs). This file targets one Molab/Modal GPU.

run_name = "tutor-rl-small"
seed = 3407

[tutor]
# Trainable policy, loaded in 4-bit with a LoRA adapter (QLoRA) via Unsloth.
model = "Qwen/Qwen2.5-3B-Instruct"
revision = "TODO: pin a commit hash"
max_seq_length = 4096
lora_rank = 16
load_in_4bit = true
temperature = 1.0
max_tokens_per_turn = 256

[student]
# Simulated student. Any OpenAI-compatible endpoint; the existing Modal vLLM deployment works.
# Credentials come from the environment (TRAIN_STUDENT_BASE_URL / _MODEL / _API_KEY), never this file.
env_prefix = "TRAIN_STUDENT"
temperature = 0.6
max_tokens_per_turn = 256

[judge]
# Judge that decides whether the tutor leaked the answer. Can share the student's endpoint.
env_prefix = "TRAIN_JUDGE"
temperature = 0.0
max_tokens = 256

[episode]
max_turns = 8              # total tutor + student messages
student_final_attempts = 2 # samples of the student's post-dialogue solution (solve rate)

[reward]
# reward = mean(student final answers correct) - leak_penalty if the judge rejects (hard lambda).
leak_penalty = 1.0
end_on_rejection = true    # PedagogicalRL's "hard" setting: stop the episode with the minimum reward

[train]
problems_per_step = 4
episodes_per_problem = 4   # GRPO group size
max_steps = 50
learning_rate = 5e-6
beta = 0.001               # KL coefficient
save_steps = 10
output_dir = "outputs/tutor-rl-small"  # outside git; see .gitignore

[data]
dataset = "openai/gsm8k"
dataset_config = "main"
revision = "TODO: pin a commit hash"
train_split = "train"
train_limit = 400
eval_split = "test"
eval_limit = 50
